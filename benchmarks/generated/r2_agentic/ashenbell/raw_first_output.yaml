metadata:
  format_version: "1.0"
  experiment_id: ashenbell_r2
  seed: 28411
  authoring_status: draft
  campaign_name: The Ashenbell Highlands
  starter_monster: cardiling
  starter_level: 7
  trainer_post_battle_dialogue: The high road rewards careful footing.

encounter_tables:
  - id: r2_south_ecology
    entries:
      - {monster: shybulb, encounter_rate: 5, level_min: 4, level_max: 6}
      - {monster: squabbit, encounter_rate: 3, level_min: 5, level_max: 7}
      - {monster: elofly, encounter_rate: 1, level_min: 5, level_max: 6}
  - id: r2_village_ecology
    entries:
      - {monster: squabbit, encounter_rate: 5, level_min: 5, level_max: 7}
      - {monster: elofly, encounter_rate: 3, level_min: 5, level_max: 7}
  - id: r2_pass_ecology
    entries:
      - {monster: elofly, encounter_rate: 5, level_min: 6, level_max: 8}
      - {monster: squabbit, encounter_rate: 2, level_min: 6, level_max: 8}
  - id: r2_quarry_ecology
    entries:
      - {monster: elofly, encounter_rate: 4, level_min: 6, level_max: 8}
      - {monster: shybulb, encounter_rate: 3, level_min: 5, level_max: 7}
      - {monster: squabbit, encounter_rate: 1, level_min: 6, level_max: 7}

region:
  id: ashenbell_r2_region
  name: The Ashenbell Highlands
  theme: A warning tradition outlives the industry and certainty that created it.
  history: Ashenbell quarried stone bells with metal tongues until a slide closed the quarry and ended the warning network decades ago.
  environment: A damp southern old road rises through cultivated margins to Split Crown Ridge and the abandoned quarry cut.
  economy: [upland gardens, sheep paths, road tending]
  conflict: A low nighttime tone has returned even though the warning system is silent.
  story_hook: Follow the old bell road and decide whether weather, stone, or buried fittings make the sound.
  progression: [Climb the south road, Cross Ashenbell, Reach Highland Pass, Optionally investigate Old Bell Quarry]
  visual_motifs: [old road, paired ridge stones, warning signs, sparse highland rocks]
  creature_ecology:
    - Shybulb occupy damp southern shade and quarry seeps, not cultivated or exposed ground.
    - Squabbit favor road margins and village plots, with fewer individuals at altitude.
    - Elofly become common in exposed pass air and quarry shafts.
  settlements:
    - id: r2_ashenbell
      name: Ashenbell
      role: Small road-and-warning settlement below Split Crown Ridge.
      economy: [gardens, grazing, road tending]
      visual_motifs: [tight house row, bell plinth, fenced plots]
  quests:
    - id: r2_bell_question
      summary: Compare Ashenbell memory with evidence along the old bell road.
      steps:
        - {id: read_plinth, kind: event, reference: r2_read_bell_plinth}
        - {id: reach_pass, kind: event, reference: r2_pass_echo}
      reward: Context for the returning tone.
    - id: r2_quarry_option
      summary: Optionally inspect the old quarry hoist and cache.
      steps:
        - {id: inspect_hoist, kind: event, reference: r2_raise_hoist}
        - {id: find_cache, kind: secret, reference: r2_quarry_cache}
      reward: potion and optional shortcut
  maps:
    - id: r2_south_route
      name: Ashenbell South Road
      map_type: route
      narrative_role: Protected woodland approach to Ashenbell.
      emotional_role: Compression, glimpse, pocket, settlement reveal.
      visual_identity: A damp pale road emerging from pine shade beneath distant paired ridge stones.
      width: 36
      height: 34
      base_terrain: forest_floor
      boundary: {kind: forest, depth: 4, density: 0.78, falloff_per_cell: 0.14}
      player_spawn: {x: 18, y: 31}
      grant_starter: true
      primary_path:
        id: r2_old_bell_road_south
        role: critical
        width: 3
        points: [{x: 18, y: 33}, {x: 19, y: 29}, {x: 23, y: 26}, {x: 24, y: 21}, {x: 18, y: 16}, {x: 15, y: 12}, {x: 18, y: 7}, {x: 18, y: 0}]
      secondary_paths:
        - id: r2_south_pocket_path
          role: optional
          width: 2
          points: [{x: 23, y: 26}, {x: 30, y: 25}, {x: 30, y: 20}, {x: 24, y: 21}]
      landmarks:
        - id: r2_split_crown_view
          name: Split Crown View
          role: dominant
          kind: ridge_silhouette
          anchor: {x: 18, y: 7}
          footprint: {x: 13, y: 4, width: 11, height: 7}
          description: Two boulder stacks frame the first open view of the uplands.
      zones:
        - {id: r2_south_west_woods, kind: forest, bounds: {x: 1, y: 3, width: 10, height: 28}, density: 0.68, tags: [pine, damp]}
        - {id: r2_south_east_woods, kind: forest, bounds: {x: 27, y: 3, width: 8, height: 16}, density: 0.64, tags: [pine]}
        - {id: r2_south_encounter_pocket, kind: encounter, bounds: {x: 27, y: 19, width: 8, height: 9}, density: 0.56, tags: [tall_grass, damp]}
        - {id: r2_south_reveal, kind: safe, bounds: {x: 12, y: 3, width: 13, height: 9}, density: 0.0, tags: [view]}
      warps:
        - {id: r2_south_to_village, at: {x: 18, y: 0}, facing: up, target_map: r2_ashenbell, target: {x: 17, y: 28}}
      npcs:
        - id: r2_south_shepherd
          role: Weather observer and shared-history witness.
          at: {x: 21, y: 28}
          sprite: botanist
          dialogue: The night tone follows the west face of Split Crown when fog presses low. My grandmother heard the quarry warnings; this is lower, but it keeps their rhythm.
          mandatory: true
      encounter_zones:
        - {id: r2_south_encounters, bounds: {x: 27, y: 19, width: 8, height: 9}, table: r2_south_ecology, probability: 9}
      environmental_features:
        - {id: r2_bellwater_rill, kind: river, bounds: {x: 0, y: 15, width: 36, height: 3}, blocks_movement: true, notes: Bellwater runs east below Ashenbell.}
        - {id: r2_bellwater_bridge, kind: bridge, bounds: {x: 16, y: 15, width: 5, height: 3}, blocks_movement: false, notes: Old road bridge.}
      props:
        - {id: r2_south_crown_west, kind: boulder, at: {x: 14, y: 7}, blocks_movement: true, semantic_role: Western crown of the distant ridge}
        - {id: r2_south_crown_east, kind: boulder, at: {x: 22, y: 7}, blocks_movement: true, semantic_role: Eastern crown of the distant ridge}
        - {id: r2_south_road_sign, kind: sign, at: {x: 26, y: 29}, blocks_movement: true, semantic_role: Old bell-road distance marker}
      events:
        - id: r2_read_south_marker
          at: {x: 26, y: 29}
          trigger: interact
          actions: [translated_dialog The marker shows a split ridge above a bell, then ASHENBELL., set_variable r2_south_marker:read]
          conditions: [not variable_set r2_south_marker:read]
      pacing_notes: [Dense opening, Ridge revealed after the rill, Western pocket detours before the village threshold]
      revision: 1

    - id: r2_ashenbell
      name: Ashenbell
      map_type: settlement
      narrative_role: Compact settlement organized around road, warning plinth, homes, and plots.
      emotional_role: Shelter and testimony before exposure.
      visual_identity: A tight western house row faces a central bell plinth; fenced productive ground lies south and the high road exits northeast.
      width: 34
      height: 30
      base_terrain: grass
      boundary: {kind: forest, depth: 2, density: 0.42, falloff_per_cell: 0.18}
      player_spawn: {x: 17, y: 27}
      primary_path:
        id: r2_old_bell_road_village
        role: critical
        width: 3
        points: [{x: 17, y: 29}, {x: 17, y: 25}, {x: 20, y: 21}, {x: 18, y: 16}, {x: 20, y: 12}, {x: 24, y: 7}, {x: 22, y: 0}]
      secondary_paths:
        - id: r2_residential_lane
          role: optional
          width: 2
          points: [{x: 18, y: 16}, {x: 13, y: 17}, {x: 8, y: 17}, {x: 8, y: 20}, {x: 15, y: 21}, {x: 20, y: 21}]
        - id: r2_shortcut_lane
          role: optional
          width: 2
          points: [{x: 20, y: 12}, {x: 25, y: 11}, {x: 29, y: 10}, {x: 32, y: 10}]
      landmarks:
        - id: r2_warning_plinth
          name: Silent Warning Plinth
          role: dominant
          kind: bell_memorial
          anchor: {x: 17, y: 15}
          footprint: {x: 14, y: 12, width: 7, height: 7}
          description: Three stones and a sign occupy the road junction where warnings were once relayed.
        - id: r2_work_yard
          name: Bell Road Yard
          role: secondary
          kind: productive_edge
          anchor: {x: 8, y: 23}
          footprint: {x: 3, y: 20, width: 10, height: 8}
          description: A fenced garden and tool yard explain the settlement's small economy.
      zones:
        - {id: r2_village_center, kind: safe, bounds: {x: 13, y: 10, width: 12, height: 11}, density: 0.0, tags: [civic]}
        - {id: r2_village_outskirts, kind: encounter, bounds: {x: 3, y: 20, width: 10, height: 8}, density: 0.38, tags: [tall_grass, cultivated]}
        - {id: r2_village_flower_edge, kind: meadow, bounds: {x: 25, y: 17, width: 7, height: 9}, density: 0.45, tags: [flowers]}
      warps:
        - {id: r2_village_to_south, at: {x: 17, y: 29}, facing: down, target_map: r2_south_route, target: {x: 18, y: 1}}
        - {id: r2_village_to_pass, at: {x: 22, y: 0}, facing: up, target_map: r2_highland_pass, target: {x: 14, y: 34}}
      npcs:
        - id: r2_bell_keeper
          role: Keeper of Ashenbell history.
          at: {x: 19, y: 17}
          sprite: scientist
          dialogue: Quarry stone carried the note and iron tongues struck it. The chain warned three valleys until the slide closed the cut. We have rung nothing since, whatever wakes at night.
          mandatory: true
        - id: r2_gardener
          role: Productive-edge resident.
          at: {x: 9, y: 22}
          sprite: miner_green
          dialogue: Squabbit steal the dry seed; Elofly hover only when the ridge wind drops.
      encounter_zones:
        - {id: r2_village_encounters, bounds: {x: 3, y: 20, width: 10, height: 8}, table: r2_village_ecology, probability: 6}
      environmental_features:
        - id: r2_garden_fence
          kind: fence
          bounds: {x: 3, y: 20, width: 10, height: 8}
          blocks_movement: true
          entrances: [{x: 8, y: 20}, {x: 8, y: 27}]
          notes: Productive plot at the southern edge.
      props:
        - {id: r2_home_one, kind: building, at: {x: 4, y: 13}, blocks_movement: true, semantic_role: Western residence}
        - {id: r2_home_two, kind: building, at: {x: 9, y: 13}, blocks_movement: true, semantic_role: Western residence}
        - {id: r2_history_house, kind: building, at: {x: 26, y: 18}, blocks_movement: true, semantic_role: Bell records and meeting room}
        - {id: r2_workshop, kind: building, at: {x: 26, y: 27}, blocks_movement: true, semantic_role: Road and garden workshop}
        - {id: r2_plinth_center, kind: boulder, at: {x: 15, y: 14}, blocks_movement: true, semantic_role: Stone bell remnant}
        - {id: r2_plinth_west, kind: boulder, at: {x: 14, y: 17}, blocks_movement: true, semantic_role: Warning plinth support}
        - {id: r2_plinth_sign, kind: sign, at: {x: 21, y: 16}, blocks_movement: true, semantic_role: Historical inscription}
      events:
        - id: r2_read_bell_plinth
          at: {x: 21, y: 16}
          trigger: interact
          actions: [translated_dialog The inscription lists three slide warnings and the year the quarry closed., set_variable r2_bell_history:read]
          conditions: [not variable_set r2_bell_history:read]
        - id: r2_village_shortcut_locked
          at: {x: 32, y: 10}
          trigger: interact
          actions: [translated_dialog The old counterweight gate is down. Its cable climbs toward the quarry.]
          conditions: [not variable_set r2_shortcut:open]
        - id: r2_village_shortcut_open
          at: {x: 32, y: 10}
          trigger: interact
          actions: [translated_dialog The raised counterweight opens the ridge stair., "transition_teleport player,r2_highland_pass.tmx,5,30,0.3", "char_face player,right"]
          conditions: [variable_set r2_shortcut:open]
      pacing_notes: [Enter through working plots, Pause at the civic plinth, Read the compact residential lane, Leave on the northeast high road]
      revision: 1

    - id: r2_highland_pass
      name: Highland Pass
      map_type: route
      narrative_role: Exposed crossing and decision point above Ashenbell.
      emotional_role: Constraint, exposure, choice, northern release.
      visual_identity: A narrow zigzag among sparse rock shelves, dominated by the Split Crown warning cairn.
      width: 36
      height: 36
      base_terrain: grass
      boundary: {kind: none, depth: 0, density: 0.0, falloff_per_cell: 0.0}
      player_spawn: {x: 14, y: 33}
      primary_path:
        id: r2_old_bell_road_pass
        role: critical
        width: 3
        points: [{x: 14, y: 35}, {x: 13, y: 31}, {x: 17, y: 27}, {x: 16, y: 22}, {x: 22, y: 18}, {x: 20, y: 13}, {x: 23, y: 8}, {x: 18, y: 0}]
      secondary_paths:
        - id: r2_quarry_track
          role: optional
          width: 2
          points: [{x: 16, y: 22}, {x: 24, y: 24}, {x: 30, y: 21}, {x: 35, y: 22}]
        - id: r2_ridge_stair
          role: optional
          width: 2
          points: [{x: 13, y: 31}, {x: 9, y: 32}, {x: 4, y: 30}]
      landmarks:
        - id: r2_split_crown_cairn
          name: Split Crown Warning Cairn
          role: dominant
          kind: paired_stone_cairn
          anchor: {x: 20, y: 13}
          footprint: {x: 17, y: 9, width: 9, height: 9}
          description: The paired rocks seen from below now frame the old warning station.
        - id: r2_quarry_turn
          name: Quarry Track Turn
          role: secondary
          kind: signed_branch
          anchor: {x: 27, y: 23}
          footprint: {x: 24, y: 20, width: 8, height: 6}
          description: A rock-lined branch leaves the north road clearly but does not block it.
      zones:
        - {id: r2_pass_south_shelf, kind: encounter, bounds: {x: 18, y: 25, width: 10, height: 7}, density: 0.28, tags: [tall_grass, exposed]}
        - {id: r2_pass_north_shelf, kind: encounter, bounds: {x: 9, y: 3, width: 15, height: 8}, density: 0.22, tags: [tall_grass, wind]}
      warps:
        - {id: r2_pass_to_village, at: {x: 14, y: 35}, facing: down, target_map: r2_ashenbell, target: {x: 22, y: 1}}
        - {id: r2_pass_to_quarry, at: {x: 35, y: 22}, facing: right, target_map: r2_old_bell_quarry, target: {x: 1, y: 14}, mandatory: false}
      npcs:
        - id: r2_pass_surveyor
          role: Weather interpretation and historical corroboration.
          at: {x: 24, y: 20}
          sprite: knight
          dialogue: The warning stones were tuned to carry across the valleys. This new tone arrives when west wind and quarry runoff coincide; weather may play what people stopped ringing.
          mandatory: true
      encounter_zones:
        - {id: r2_pass_south_encounters, bounds: {x: 18, y: 25, width: 10, height: 7}, table: r2_pass_ecology, probability: 8}
        - {id: r2_pass_north_encounters, bounds: {x: 9, y: 3, width: 15, height: 8}, table: r2_pass_ecology, probability: 8}
      props:
        - {id: r2_cairn_west, kind: boulder, at: {x: 17, y: 13}, blocks_movement: true, semantic_role: Western crown stone}
        - {id: r2_cairn_east, kind: boulder, at: {x: 24, y: 13}, blocks_movement: true, semantic_role: Eastern crown stone}
        - {id: r2_quarry_sign, kind: sign, at: {x: 29, y: 20}, blocks_movement: true, semantic_role: Abandoned quarry branch marker}
        - {id: r2_pass_rock_01, kind: rock, at: {x: 8, y: 32}, blocks_movement: true, semantic_role: Sparse exposed scree}
        - {id: r2_pass_rock_02, kind: rock, at: {x: 25, y: 29}, blocks_movement: true, semantic_role: Sparse exposed scree}
        - {id: r2_pass_rock_03, kind: boulder, at: {x: 29, y: 16}, blocks_movement: true, semantic_role: Cliff shelf}
        - {id: r2_pass_rock_04, kind: rock, at: {x: 12, y: 12}, blocks_movement: true, semantic_role: Sparse exposed scree}
        - {id: r2_pass_rock_05, kind: boulder, at: {x: 7, y: 7}, blocks_movement: true, semantic_role: Northern ridge wall}
        - {id: r2_pass_rock_06, kind: rock, at: {x: 28, y: 6}, blocks_movement: true, semantic_role: Northern ridge wall}
      events:
        - id: r2_pass_echo
          at: {x: 20, y: 13}
          trigger: interact
          actions: [translated_dialog The cairn inscription matches Ashenbell's three warnings. A hollow tone trembles through its west stone.]
          conditions: [variable_set r2_bell_history:read]
        - id: r2_pass_shortcut_locked
          at: {x: 4, y: 30}
          trigger: interact
          actions: [translated_dialog A lowered counterweight blocks the old ridge stair.]
          conditions: [not variable_set r2_shortcut:open]
        - id: r2_pass_shortcut_open
          at: {x: 4, y: 30}
          trigger: interact
          actions: [translated_dialog The quarry hoist keeps the ridge stair open., "transition_teleport player,r2_ashenbell.tmx,31,10,0.3", "char_face player,left"]
          conditions: [variable_set r2_shortcut:open]
      pacing_notes: [Tight southern ascent, Cairn anchors the center, Quarry branch reads east while the mandatory road continues north]
      revision: 1

    - id: r2_old_bell_quarry
      name: Old Bell Quarry
      map_type: dungeon
      narrative_role: Optional evidence and shortcut-control sub-area.
      emotional_role: Material density, investigation, reinterpretation.
      visual_identity: A dark worked cut crowded by stone, damp growth, and a surviving hoist line.
      width: 30
      height: 28
      base_terrain: forest_floor
      boundary: {kind: none, depth: 0, density: 0.0, falloff_per_cell: 0.0}
      player_spawn: {x: 2, y: 14}
      primary_path:
        id: r2_quarry_floor
        role: critical
        width: 3
        points: [{x: 0, y: 14}, {x: 6, y: 14}, {x: 9, y: 11}, {x: 15, y: 9}, {x: 20, y: 12}, {x: 24, y: 8}, {x: 27, y: 8}]
      secondary_paths:
        - id: r2_quarry_lower_cut
          role: optional
          width: 2
          points: [{x: 9, y: 11}, {x: 8, y: 19}, {x: 14, y: 23}, {x: 22, y: 21}, {x: 25, y: 15}, {x: 24, y: 8}]
      landmarks:
        - id: r2_cracked_bell_cut
          name: Cracked Bell Cut
          role: dominant
          kind: worked_stone_ring
          anchor: {x: 20, y: 12}
          footprint: {x: 13, y: 7, width: 9, height: 9}
          description: A dense ring of worked boulders surrounds a water-dark crack and rusted fittings.
        - id: r2_old_hoist
          name: Old Counterweight Hoist
          role: secondary
          kind: quarry_mechanism
          anchor: {x: 25, y: 8}
          footprint: {x: 22, y: 5, width: 7, height: 7}
          description: A surviving line can lift the ridge-stair counterweight.
      zones:
        - {id: r2_quarry_damp_cut, kind: encounter, bounds: {x: 7, y: 16, width: 11, height: 9}, density: 0.42, tags: [tall_grass, damp]}
        - {id: r2_quarry_shaft_air, kind: encounter, bounds: {x: 16, y: 3, width: 12, height: 8}, density: 0.25, tags: [tall_grass, shaft]}
      warps:
        - {id: r2_quarry_to_pass, at: {x: 0, y: 14}, facing: left, target_map: r2_highland_pass, target: {x: 34, y: 22}, mandatory: false}
      npcs:
        - id: r2_quarry_prospector
          role: Material-evidence witness.
          at: {x: 18, y: 15}
          sprite: miner_green
          dialogue: They cut resonant stone here and hung iron tongues inside. The slide buried straps beside that wet crack; wind and runoff can make the whole cut answer without a bell being rung.
      encounter_zones:
        - {id: r2_quarry_damp_encounters, bounds: {x: 7, y: 16, width: 11, height: 9}, table: r2_quarry_ecology, probability: 8}
        - {id: r2_quarry_shaft_encounters, bounds: {x: 16, y: 3, width: 12, height: 8}, table: r2_quarry_ecology, probability: 8}
      secrets:
        - {id: r2_quarry_cache, at: {x: 14, y: 23}, reward: potion, clue: A surveyor's potion lies beside notes linking the tone to wet stone and buried iron.}
      props:
        - {id: r2_quarry_ring_01, kind: boulder, at: {x: 17, y: 8}, blocks_movement: true, semantic_role: Worked bell-stone}
        - {id: r2_quarry_ring_02, kind: boulder, at: {x: 21, y: 8}, blocks_movement: true, semantic_role: Worked bell-stone}
        - {id: r2_quarry_ring_03, kind: boulder, at: {x: 23, y: 11}, blocks_movement: true, semantic_role: Worked bell-stone}
        - {id: r2_quarry_ring_04, kind: boulder, at: {x: 19, y: 15}, blocks_movement: true, semantic_role: Worked bell-stone}
        - {id: r2_quarry_ring_05, kind: rock, at: {x: 16, y: 13}, blocks_movement: true, semantic_role: Broken stone billet}
        - {id: r2_quarry_wall_01, kind: boulder, at: {x: 4, y: 5}, blocks_movement: true, semantic_role: Dense quarry wall}
        - {id: r2_quarry_wall_02, kind: boulder, at: {x: 7, y: 5}, blocks_movement: true, semantic_role: Dense quarry wall}
        - {id: r2_quarry_wall_03, kind: boulder, at: {x: 4, y: 22}, blocks_movement: true, semantic_role: Dense quarry wall}
        - {id: r2_quarry_wall_04, kind: boulder, at: {x: 25, y: 23}, blocks_movement: true, semantic_role: Dense quarry wall}
        - {id: r2_hoist_sign, kind: sign, at: {x: 27, y: 5}, blocks_movement: true, semantic_role: Hoist control and warning placard}
      events:
        - id: r2_quarry_evidence
          at: {x: 20, y: 12}
          trigger: interact
          actions: [translated_dialog Water pulses through the cracked stone. A buried iron strap vibrates with the same low interval described below.]
        - id: r2_raise_hoist
          at: {x: 25, y: 8}
          trigger: interact
          actions: [translated_dialog You brace the old hoist. Far below, the ridge-stair counterweight rises., set_variable r2_hoist:raised]
          conditions: [not variable_set r2_shortcut:open]
        - id: r2_hoist_raised
          at: {x: 25, y: 8}
          trigger: interact
          actions: [translated_dialog The hoist remains braced; the shortcut should stay open.]
          conditions: [variable_set r2_shortcut:open]
      pacing_notes: [Immediate material contrast, Dense central evidence ring, Lower loop pays out story and item, Hoist changes later traversal]
      revision: 1
