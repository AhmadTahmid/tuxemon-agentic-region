episode:
  slug: low_bell
  title: "Ashenbell: The Low Bell"
  target_minutes: [60, 90]
  story_states: [intro, investigation, quarry_discovered, resolved]
  start_map: low_bell_south_approach
  start_position: [17, 42]
  complete_variable: low_bell_episode_complete

starters:
  level: 5
  choices:
    - slug: anoleaf
      role: quick_utility
    - slug: flounce
      role: direct_offense_and_protection
    - slug: rockitten
      role: sturdy_earth_control

climax:
  monster: jemuar
  role: frightened_territorial_resonance_amplifier
