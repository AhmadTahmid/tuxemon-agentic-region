        purpose: environmental evidence that stone and metal carry the tone
        conditions: [not variable_set low_bell_south_rail_seen:yes]
        actions:
          - translated_dialog low_bell_south_rail
          - set_variable low_bell_south_rail_seen:yes
      - slug: settlement_reveal
