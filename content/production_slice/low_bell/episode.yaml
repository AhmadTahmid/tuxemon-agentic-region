dialogue:
  low_bell_opening_tone: "A low note rolls under the rain. Leaves jump; frightened creatures spill onto the path."
  low_bell_nera_opening: "Nera: That was no thunder. Stay close—those creatures are running from something."
  low_bell_nera_starter: "Nera: You need a partner, not a weapon. Choose the one whose way of working makes sense to you."
  low_bell_nera_clear_path: "Nera: The frightened Shybulb ahead cannot settle while we crowd it. Approach slowly; I will talk you through the battle."
  low_bell_tutorial_creature: "The Shybulb shivers, then plants itself across the path."
  low_bell_nera_after_tutorial: "Nera: Good. You gave it room to retreat. Take these Tuxeballs—some displaced creatures may accept a calmer approach."
  low_bell_south_rail: "The old guide rail hums against the stream stones. Tiny tracks point uphill, away from the wet bank."
  low_bell_settlement_reveal: "Ashenbell appears beyond the trees. Far above its roofs, Split Crown Ridge divides the cloud."
  low_bell_mara_investigation: "Mara: The old bells were measured, named and maintained. This tone is lower. Ask Sela what the ridge is carrying."
  low_bell_iven_investigation: "Iven: I paid for a survey, nothing more. If a cleared ditch frightens people, perhaps the ditch needed attention."
  low_bell_nera_town: "Nera: Garden species moved first, then woodland species. Whatever changed is travelling downhill through water or ground."
  low_bell_jori_intro: "Jori: Squabbit follows noises under the floor. It ran north last night and did not come back."
  low_bell_sela_investigation: "Sela: Every report follows heavy runoff and a west wind. Split Crown carries the tone; the source lies beyond its east shoulder."
  low_bell_return_for_tovin: "The fresh survey marks match Tovin's hoist sketch. His workshop may hold the safe way into the lower works."
  low_bell_return_mara: "Mara: We will keep the names and retire the machinery. A memorial is not an instruction to repeat the past."
  low_bell_return_iven: "Iven: My crew opened the western runnel. I hid that because I wanted the survey to look harmless. I will pay to make it safe."
  low_bell_return_tovin: "Tovin: I approved that last shift. Silence did not change it. I can still teach the next crew where to stop."
  low_bell_return_nera: "Nera: Shybulb are back at the stream, and the garden Squabbit stopped digging at the foundations. The pressure is easing."
  low_bell_ending_hook: "Nera pins a courier note beside the revised memorial notice: the western valley has reported the same displaced Corvix flight."
  low_bell_mara_resolved: "Mara: The silent memorial remains. This year we will also read the maintenance oath—the part everyone stopped reading."
  low_bell_iven_resolved: "Iven: Ashenbell still needs work. Reopening blindly was not work; it was wishing with other people's risk."
  low_bell_nera_resolved: "Nera: Habitat is a better witness than rumour. The creatures are already drawing the new map for us."
  low_bell_jori_resolved_pending: "Jori: The quarry path is safer now. I am going to keep watching for Squabbit's tracks."
  low_bell_alda_intro: "Alda: Caper ate seedlings before. They never slept under my tool bench until that tone began."
  low_bell_alda_resolved: "Alda: No one under the bench this morning. I had forgotten how welcome an ordinary bite mark could look."
  low_bell_bren_intro: "Bren: These hairline cracks are old. The fresh grit inside them is not. I can tell you that much and no more."
  low_bell_bren_resolved: "Bren: Iven bought drain stone. I made him buy inspection markers too."
  low_bell_caro_intro: "Caro: Three guests heard a ghost; two heard weather; one slept through it. That is why I serve breakfast, not conclusions."
  low_bell_caro_resolved: "Caro: Tonight's wager is whether the inn can be quiet enough for anyone to complain."
  low_bell_archive_diagram: "The diagram shows three tuned bells, each with a narrow metal tongue. A note in Mara's hand reads: LOW TONE IS NOT A WARNING SIGNAL."
  low_bell_tovin_initial: "Tovin: Hoists, drains, bells—people remember the nouns and forget the inspection. I will not help anyone reopen that place."
  low_bell_tovin_briefing: "Tovin studies the survey mark. 'That runnel fed the lower fracture. Brace the cradle before you touch the hoist, or the stone will answer.'"
  low_bell_tovin_reminder: "Tovin: Water first. Brace second. Hoist last. The order kept weight off the cracked shelf."
  low_bell_tovin_resolved: "Tovin: I kept the procedure and buried the reason. Mara was right: facts cannot protect anyone if we refuse to speak them."
  low_bell_rook_challenge: "Rook: The upper pass has nowhere to hide from wind or a panicked monster. Show me you can hold a line without chasing."
  low_bell_rook_victory: "Rook: Good footing. Split Crown is loudest on the east shelf; follow the rock, not the echo."
  low_bell_rook_after: "Rook: Corvix have left the west face. Rockitten are climbing out of cracks they normally sleep in. That is a direction, not bad luck."
  low_bell_split_crown_tone: "The low tone arrives through the ridge before it reaches the air. Loose stones chatter toward the quarry fork."
  low_bell_quarry_fork: "Fresh cart ruts cut across the abandoned track. Blue survey cloth is caught on a stone pointing east."
  low_bell_survey_disturbance: "The survey stake bears Iven's trade mark. A freshly cleared runnel sends rainwater beneath a slab labelled LOWER RESONANCE BAY."
  low_bell_sela_need_tovin: "Sela: I can prove where the water went. Tovin is the one who knows what is carrying the load below it. Bring me his sequence."
  low_bell_sela_enter: "Sela: That matches the old maintenance marks. I will watch the runnel; use Tovin's order in the lower works."
  low_bell_quarry_fitting: "A bent metal tongue lies pinned under resonant stone. Rust is old; bright scrapes around the drainage bolt are recent."
  low_bell_lower_collapse: "Broken shift boards remain where the roof fell. The final line is smeared, but the inspection boxes were never signed."
  low_bell_hoist_apply: "You divert the trickle, seat the cradle brace, then ease the hoist brake. The chamber floor settles instead of ringing."
  low_bell_jemuar_reveal: "A massive Jemuar rises beside the buried assembly. Each frightened step drives a lower note through stone and metal."
  low_bell_jemuar_after: "Jemuar backs into a dry fissure. Without its weight, the note thins—but water still runs across the buried fitting."
  low_bell_assembly_action: "You close the survey cut and wedge the loose tongue clear of the fractured bell stone. Water returns to the old drain."
  low_bell_return_objective: "The chamber falls quiet. Return to Ashenbell; the village needs the whole account."
  low_bell_ren_challenge: "Ren: I am carrying medicine uphill, but the wet pocket is full of skittish creatures. A short match will show whether your partner is ready to help."
  low_bell_ren_victory: "Ren: Steady enough. Take this potion; a courier who arrives empty-handed has only delivered a problem."
  low_bell_ren_after: "Ren: The grass here gives creatures an exit. Weaken one, then offer a Tuxeball—do not corner it."
  low_bell_name_south_found: "A weathered shift token is wedged behind the overlook stone: INA VEL, DRAIN CREW. The ridge line matches Mara's memorial map."
  low_bell_secret_south: "Under the stream marker, a courier's waxed pouch still holds a Super Potion."
  low_bell_mara_names_offer: "Mara: Three names on the silent-shift roll are weathered away. If you find marked tokens or rubbings, bring the facts—not guesses."
  low_bell_mara_names_progress: "Mara: The pass survey shelf and the old quarry pockets carried duplicate shift marks. Record only what you can read."
  low_bell_mara_names_complete: "Mara aligns the three records. 'Ina Vel. Oren Pike. Mett Saro. The memorial will not leave blank spaces where people stood.'"
  low_bell_mara_resolved_names: "Mara: The maintenance oath will be read beneath all the names—including the three you returned. Memory must include what the work demanded."
  low_bell_jori_searching: "Jori: Squabbit likes dry ledges where a low noise tickles its feet. It hates running water, so look above the quarry runnel."
  low_bell_jori_return: "Squabbit bounds from behind you. Jori laughs once, then grips its ears. 'No more following underground songs. These are for you.'"
  low_bell_jori_complete: "Jori: Squabbit sleeps beside the warm wall now. If the stones hum, it comes to find me first."
  low_bell_jori_resolved_complete: "Jori: Squabbit did not chase the tone last night. We both heard ordinary rain, which is much better."
  low_bell_pell_intro: "Pell: The north post is closed, so every courier is sharing the South Approach. Find the cause and you will reopen more than a road."
  low_bell_pell_resolved: "Pell: The north post wants a field report from the western valley. Nera already put your name beside mine."
  low_bell_garden_caper: "A displaced Caper has nested between the seed rows. It stamps at every vibration from the north."
  low_bell_alda_garden_thanks: "Alda: It chose the upper pasture once it had room. Good—gardens should feed creatures, not trap them."
  low_bell_kesh_challenge: "Kesh: Corvix keep striking my survey flags. Help me test their pattern; if you hold your ground, I can finish the rubbing."
  low_bell_kesh_victory: "Kesh: They broke east on the same gust that carried the tone. Take the medicine—I have the observation I needed."
  low_bell_kesh_after: "Kesh: The old rubbing is beside the high marker. The wind cache beyond it was left for crews caught above cloud."
  low_bell_name_pass_found: "A charcoal rubbing preserves a second line: OREN PIKE, HOIST WATCH. The paper is recent; the carved mark is not."
  low_bell_secret_pass: "The wind cache contains two Earth Tuxeballs, wrapped against grit and rain."
  low_bell_squabbit_found: "A mud-streaked Squabbit crouches on the dry ledge. At Jori's name it chirps, then follows at a careful distance."
  low_bell_rockat_guard: "A Rockat claws at the lower gate whenever the runoff touches stone. It is cornered between the tone and the open track."
  low_bell_rockat_after: "The Rockat retreats to a dry shelf. The lower gate is clear, and its old brace marks match Tovin's sequence."
  low_bell_name_quarry_found: "A brass strip reads METT SARO, CRADLE RIGGER. A sealed emergency wrap behind it still contains a Revive."
  low_bell_puzzle_runoff: "You turn the labelled RUNOFF gate. Water leaves the fractured shelf and enters the old drain."
  low_bell_puzzle_cradle: "You seat the CRADLE brace into the unloaded frame. The resonant slab stops shifting."
  low_bell_puzzle_hoist: "You ease the HOIST brake last. The frame settles, and its service cage opens a route back to the pass."
  low_bell_puzzle_wrong: "The control will not move safely in this state. The three labels repeat the maintenance order: RUNOFF — CRADLE — HOIST."
  low_bell_tovin_resolved_names: "Tovin: Mett Saro set that cradle beside me. Seeing his name restored does not excuse my signature. It tells me who my silence excluded."
