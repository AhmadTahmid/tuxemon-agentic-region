      - slug: opening_low_tone
        at: {x: 0, y: 0}
        trigger: init
        anchor_required: false
        purpose: opening hook and creature displacement
        mandatory: true
        conditions: [not variable_set low_bell_tone_seen:yes]
        actions:
          - play_sound japanese_temple_bell_small,0.55
          - camera_shake 0.7,0.8
          - translated_dialog low_bell_opening_tone
          - translated_dialog low_bell_nera_opening
          - set_teleport_faint player,low_bell_south_approach.tmx,17,42
          - set_variable low_bell_tone_seen:yes
      - slug: choose_starter
        at: {x: 16, y: 39}
        trigger: talk
        npc: low_bell_nera
        purpose: meaningful starter selection
        mandatory: true
        conditions:
          - is variable_set low_bell_tone_seen:yes
          - not variable_set low_bell_starter_chosen:yes
        actions:
          - translated_dialog low_bell_nera_starter
          - choice_monster anoleaf:flounce:rockitten,low_bell_starter_choice
          - add_monster low_bell_starter_choice,5
          - add_item potion,2
          - set_variable low_bell_starter_chosen:yes
      - slug: nera_before_tutorial
        at: {x: 16, y: 39}
        trigger: talk
        npc: low_bell_nera
        purpose: clear immediate goal
        conditions:
          - is variable_set low_bell_starter_chosen:yes
          - not variable_set low_bell_tutorial_won:yes
        actions: [translated_dialog low_bell_nera_clear_path]
      - slug: frightened_shybulb_tutorial
        at: {x: 13, y: 35}
        bounds: {x: 11, y: 34, width: 5, height: 2}
        trigger: touch
        purpose: real tutorial battle caused by the tone
        mandatory: true
        conditions:
          - is variable_set low_bell_starter_chosen:yes
          - not battle_outcome player,won,wild_encounter
        actions:
          - translated_dialog low_bell_tutorial_creature
          - wild_encounter shybulb,3
      - slug: tutorial_victory
        at: {x: 0, y: 0}
        trigger: init
        anchor_required: false
        purpose: capture kit and next objective
        mandatory: true
        conditions:
          - is battle_outcome player,won,wild_encounter
          - not variable_set low_bell_tutorial_won:yes
        actions:
          - translated_dialog low_bell_nera_after_tutorial
          - add_item tuxeball,5
          - modify_monster_health
          - set_variable low_bell_tutorial_won:yes
      - slug: vibrating_rail_evidence
